# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# speed up builds
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# AndroidX changes the package structure to make it clearer which packages are
# Android's and which are apps'
android.useAndroidX=true
# Kotlin code style for this project, official or obsolete
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class is in a namespace
# matching the library's package. (?)
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
